<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">Vehicle Theft Detection System Computer Architecture</title>
  <desc id="desc">Layered architecture showing camera and video inputs, the FastAPI backend pipeline, computer vision components, database and alert services, and the React dashboard.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="vision" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="services" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #bfdbfe; }
      .section { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .box-title { font: 700 17px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
      .label { font: 600 13px Arial, sans-serif; fill: #1e40af; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .blue-line { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrowBlue); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="#f8fafc"/>
  <rect x="0" y="0" width="1800" height="115" fill="url(#header)"/>
  <text x="70" y="52" class="title" style="font-size:30px">Vehicle Theft Detection System</text>
  <text x="70" y="84" class="subtitle">Computer architecture • real-time computer vision, recognition, database association, and alerting</text>

  <!-- Input layer -->
  <text x="70" y="157" class="section">1. Data sources</text>
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="230" height="112" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="185" y="216" text-anchor="middle" class="box-title">Live camera</text>
    <text x="185" y="242" text-anchor="middle" class="box-text">USB / IP / RTSP</text>
    <text x="185" y="267" text-anchor="middle" class="small">OpenCV VideoCapture</text>
    <rect x="350" y="180" width="230" height="112" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="465" y="216" text-anchor="middle" class="box-title">Video file</text>
    <text x="465" y="242" text-anchor="middle" class="box-text">Uploaded footage</text>
    <text x="465" y="267" text-anchor="middle" class="small">Sequential analysis</text>
    <rect x="630" y="180" width="230" height="112" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="745" y="216" text-anchor="middle" class="box-title">Dataset image</text>
    <text x="745" y="242" text-anchor="middle" class="box-text">Single-frame analysis</text>
    <text x="745" y="267" text-anchor="middle" class="small">Recognition forced once</text>
  </g>

  <!-- Backend boundary -->
  <rect x="40" y="330" width="1720" height="555" rx="22" fill="url(#backend)" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="70" y="370" class="section">2. FastAPI backend and real-time processing pipeline</text>
  <text x="70" y="397" class="small">Threaded capture • newest-frame policy for live sources • stage striding • per-track caching • rolling FPS measurement</text>

  <!-- Pipeline boxes -->
  <g filter="url(#shadow)">
    <rect x="70" y="430" width="250" height="145" rx="14" fill="url(#vision)" stroke="#14b8a6" stroke-width="2"/>
    <text x="195" y="466" text-anchor="middle" class="box-title">YOLOv8n detector</text>
    <text x="195" y="494" text-anchor="middle" class="box-text">Vehicles + persons</text>
    <text x="195" y="519" text-anchor="middle" class="small">car • motorcycle • bus • truck</text>
    <text x="195" y="544" text-anchor="middle" class="small">ByteTrack IDs (optional)</text>

    <rect x="380" y="430" width="250" height="145" rx="14" fill="url(#vision)" stroke="#14b8a6" stroke-width="2"/>
    <text x="505" y="466" text-anchor="middle" class="box-title">Plate localisation</text>
    <text x="505" y="494" text-anchor="middle" class="box-text">Fine-tuned YOLO model</text>
    <text x="505" y="519" text-anchor="middle" class="small">Roboflow hosted option</text>
    <text x="505" y="544" text-anchor="middle" class="small">OpenCV fallback</text>

    <rect x="690" y="430" width="250" height="145" rx="14" fill="url(#vision)" stroke="#14b8a6" stroke-width="2"/>
    <text x="815" y="466" text-anchor="middle" class="box-title">Plate OCR</text>
    <text x="815" y="494" text-anchor="middle" class="box-text">CLAHE → denoise → Otsu</text>
    <text x="815" y="519" text-anchor="middle" class="small">EasyOCR / PaddleOCR</text>
    <text x="815" y="544" text-anchor="middle" class="small">Normalise + fuzzy match</text>

    <rect x="1000" y="430" width="250" height="145" rx="14" fill="url(#vision)" stroke="#14b8a6" stroke-width="2"/>
    <text x="1125" y="466" text-anchor="middle" class="box-title">Face recognition</text>
    <text x="1125" y="494" text-anchor="middle" class="box-text">YuNet face detection</text>
    <text x="1125" y="519" text-anchor="middle" class="small">SFace embeddings</text>
    <text x="1125" y="544" text-anchor="middle" class="small">Cosine gallery matching</text>

    <rect x="1310" y="430" width="250" height="145" rx="14" fill="url(#vision)" stroke="#14b8a6" stroke-width="2"/>
    <text x="1435" y="466" text-anchor="middle" class="box-title">Association</text>
    <text x="1435" y="494" text-anchor="middle" class="box-text">Person → nearest vehicle</text>
    <text x="1435" y="519" text-anchor="middle" class="small">IoU and centre distance</text>
    <text x="1435" y="544" text-anchor="middle" class="small">Vehicle-specific evidence</text>

    <rect x="500" y="670" width="330" height="145" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="665" y="706" text-anchor="middle" class="box-title">Theft engine</text>
    <text x="665" y="734" text-anchor="middle" class="box-text">Explainable 0–100 threat score</text>
    <text x="665" y="759" text-anchor="middle" class="small">Owner suppression • loitering</text>
    <text x="665" y="784" text-anchor="middle" class="small">Stolen flag override • reason text</text>

    <rect x="970" y="670" width="280" height="145" rx="14" fill="url(#services)" stroke="#f97316" stroke-width="2"/>
    <text x="1110" y="706" text-anchor="middle" class="box-title">Persistence</text>
    <text x="1110" y="734" text-anchor="middle" class="box-text">Detection logs + evidence</text>
    <text x="1110" y="759" text-anchor="middle" class="small">SQLite database</text>
    <text x="1110" y="784" text-anchor="middle" class="small">Annotated frames and metadata</text>

    <rect x="1320" y="670" width="280" height="145" rx="14" fill="url(#services)" stroke="#f97316" stroke-width="2"/>
    <text x="1460" y="706" text-anchor="middle" class="box-title">Alert dispatcher</text>
    <text x="1460" y="734" text-anchor="middle" class="box-text">Threshold ≥ 60</text>
    <text x="1460" y="759" text-anchor="middle" class="small">SMTP email with evidence</text>
    <text x="1460" y="784" text-anchor="middle" class="small">Twilio SMS + cooldown</text>
  </g>

  <!-- Arrows within pipeline -->
  <path d="M185 292 L185 395 L195 395 L195 430" class="line"/>
  <path d="M465 292 L465 395 L195 395" class="line"/>
  <path d="M745 292 L745 395 L195 395" class="line"/>
  <path d="M320 502 L380 502" class="blue-line"/>
  <path d="M630 502 L690 502" class="blue-line"/>
  <path d="M940 502 L1000 502" class="blue-line"/>
  <path d="M1250 502 L1310 502" class="blue-line"/>
  <path d="M1435 575 L1435 625 L665 625 L665 670" class="line"/>
  <path d="M815 575 L815 625 L665 625" class="line"/>
  <path d="M1125 575 L1125 625 L665 625" class="line"/>
  <path d="M830 742 L970 742" class="line"/>
  <path d="M1250 742 L1320 742" class="line"/>

  <!-- Output layer -->
  <text x="70" y="935" class="section">3. User interface and operational outputs</text>
  <g filter="url(#shadow)">
    <rect x="70" y="965" width="400" height="130" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="270" y="1002" text-anchor="middle" class="box-title">React + Tailwind dashboard</text>
    <text x="270" y="1030" text-anchor="middle" class="box-text">Live monitoring • analysis • vehicles • owners</text>
    <text x="270" y="1056" text-anchor="middle" class="small">Alerts • statistics • authenticated views</text>

    <rect x="700" y="965" width="400" height="130" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="900" y="1002" text-anchor="middle" class="box-title">FastAPI HTTP and stream APIs</text>
    <text x="900" y="1030" text-anchor="middle" class="box-text">JWT authentication • RBAC • MJPEG stream</text>
    <text x="900" y="1056" text-anchor="middle" class="small">Annotated detections and threat explanations</text>

    <rect x="1330" y="965" width="400" height="130" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
    <text x="1530" y="1002" text-anchor="middle" class="box-title">Operator response</text>
    <text x="1530" y="1030" text-anchor="middle" class="box-text">Review evidence and threat triggers</text>
    <text x="1530" y="1056" text-anchor="middle" class="small">Investigate, acknowledge, or escalate alert</text>
  </g>
  <path d="M1110 815 L1110 900 L900 900 L900 965" class="line"/>
  <path d="M1460 815 L1460 900 L1530 900 L1530 965" class="line"/>
  <path d="M700 1030 L470 1030" class="line"/>

  <!-- Legend -->
  <rect x="70" y="1120" width="1660" height="35" rx="8" fill="#e2e8f0"/>
  <circle cx="100" cy="1137" r="8" fill="#14b8a6"/><text x="118" y="1142" class="small">AI perception</text>
  <circle cx="280" cy="1137" r="8" fill="#2563eb"/><text x="298" y="1142" class="small">decision logic</text>
  <circle cx="460" cy="1137" r="8" fill="#f97316"/><text x="478" y="1142" class="small">persistence and alerts</text>
  <circle cx="725" cy="1137" r="8" fill="#8b5cf6"/><text x="743" y="1142" class="small">application interface</text>
  <text x="1530" y="1142" text-anchor="middle" class="label">Vehicle Theft Detection Architecture</text>
</svg>
